[project]
name = "gharos-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "google-cloud-aiplatform>=1.165.1",
    "google-cloud-firestore>=2.28.1",
    "google-cloud-pubsub>=2.39.1",
    "google-cloud-secret-manager>=2.30.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# "." so `app` (backend/app/) resolves regardless of how the pytest
# entry-point script was invoked (it does not always add cwd itself).
# ".." so `contracts` (repo root, CTO-owned, no pyproject.toml of its own)
# resolves too. Order matters: "." first so `app` wins over any same-named
# top-level module the parent path might otherwise shadow.
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = [
    "live_gcp: hits the real GCP project over the network (Secret Manager has no emulator); skipped unless GHAROS_RUN_LIVE_GCP_TESTS=1 and GCP_PROJECT_ID are set — see backend/tests/test_secret_manager_adapter.py",
]

[tool.mypy]
mypy_path = ".."
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
